<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#000000"/>
  <!-- Football pentagon pattern — minimalist, white on black -->
  <circle cx="16" cy="16" r="11" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <!-- Center pentagon -->
  <polygon points="16,9 19.8,11.9 18.4,16.3 13.6,16.3 12.2,11.9" stroke="#ffffff" stroke-width="1" fill="none"/>
  <!-- Outer patches suggestion lines -->
  <line x1="16" y1="9" x2="16" y2="5" stroke="#ffffff" stroke-width="1"/>
  <line x1="19.8" y1="11.9" x2="23.5" y2="10.2" stroke="#ffffff" stroke-width="1"/>
  <line x1="18.4" y1="16.3" x2="21.1" y2="19.5" stroke="#ffffff" stroke-width="1"/>
  <line x1="13.6" y1="16.3" x2="10.9" y2="19.5" stroke="#ffffff" stroke-width="1"/>
  <line x1="12.2" y1="11.9" x2="8.5" y2="10.2" stroke="#ffffff" stroke-width="1"/>
</svg>
